[package]
name = "permission-manager"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "GrowStreams V2 — Delegate roles and app-level permissions for stream management"

[dependencies]
sails-rs.workspace = true
gstd.workspace = true
parity-scale-codec.workspace = true
scale-info.workspace = true

[build-dependencies]
sails-rs = { workspace = true, features = ["wasm-builder"] }

[lib]
crate-type = ["cdylib", "rlib"]
