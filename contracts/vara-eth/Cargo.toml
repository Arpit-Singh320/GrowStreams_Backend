[workspace]
members = [
    "stream-core",
]
resolver = "2"

# Vara.eth (ethexe) contracts use sails-rs 1.0.0 with the ethexe feature.
# This is a separate workspace from contracts/ (which targets Vara native 0.6).
# Do NOT mix these two workspaces — ethexe and non-ethexe runtimes are incompatible.
[workspace.dependencies]
sails-rs = { version = "1.0.0", features = ["ethexe"] }
parity-scale-codec = { version = "3", default-features = false, features = ["derive"] }
scale-info = { version = "2", default-features = false, features = ["derive"] }
