[package]
name = "stream-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "GrowStreams V2 — Core streaming state machine for per-second token flows on Vara"

[dependencies]
sails-rs.workspace = true
gstd.workspace = true
parity-scale-codec.workspace = true
scale-info.workspace = true

[build-dependencies]
sails-rs = { workspace = true, features = ["wasm-builder"] }

[lib]
crate-type = ["cdylib", "rlib"]
