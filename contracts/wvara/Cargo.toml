[package]
name = "wvara"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Wrapped VARA — VFT token that wraps native VARA 1:1 for use in GrowStreams streaming"

[dependencies]
sails-rs.workspace = true
gstd.workspace = true
parity-scale-codec.workspace = true
scale-info.workspace = true

[build-dependencies]
sails-rs = { workspace = true, features = ["wasm-builder"] }

[lib]
crate-type = ["cdylib", "rlib"]
