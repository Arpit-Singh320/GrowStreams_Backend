[package]
name = "liquidation-manager"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "GrowStreams Liquidation Manager — solvency enforcement for Super Token streams"

[dependencies]
sails-rs.workspace = true
gstd.workspace = true
parity-scale-codec.workspace = true
scale-info.workspace = true

[build-dependencies]
sails-rs = { workspace = true, features = ["wasm-builder"] }

[lib]
crate-type = ["cdylib", "rlib"]
