[workspace]
members = [
    "stream-core",
    "token-vault",
    "splits-router",
    "permission-manager",
    "adapters/bounty-adapter",
    "identity-registry",
    "grow-token",
    "quest-seeds",
    "wvara",
]
resolver = "2"

[workspace.dependencies]
sails-rs = "0.10"
gstd = "=1.10.0"
parity-scale-codec = { version = "=3.7.5", default-features = false, features = ["derive"] }
scale-info = { version = "2", default-features = false, features = ["derive"] }
